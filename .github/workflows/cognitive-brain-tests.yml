name: Cognitive Brain Tests

on:
  push:
    paths:
      - "jarvis_cognitive_brain/**"
      - ".github/workflows/cognitive-brain-tests.yml"
  pull_request:
    paths:
      - "jarvis_cognitive_brain/**"
      - ".github/workflows/cognitive-brain-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis_cognitive_brain
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jarvis_cognitive_brain/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio

      - name: Compile Python modules
        run: python -m compileall -q jarvis tests

      - name: Run unit tests
        run: pytest -q tests/unit
